version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: sora_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: sora_platform
      MYSQL_USER: sora_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sora_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 注意：不使用 init.sql，改为在 API 容器启动后执行 init_db.py
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/队列
  redis:
    image: redis:7-alpine
    container_name: sora_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask API 服务
  api:
    build: .
    container_name: sora_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      # 🔴 修改1：把 production 改为 development，开启 Flask 调试模式
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URI=mysql+pymysql://sora_user:${MYSQL_PASSWORD:-sora_password}@mysql:3306/sora_platform?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 🔴 修改2：在 gunicorn 命令中加入 --reload
    # 建议开发环境把 workers (-w) 减少到 1 或 2，避免日志太乱
    command: gunicorn --reload -w 2 -b 0.0.0.0:5000 run:app
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gevent 异步任务 Worker
  worker:
    build: .
    container_name: sora_worker
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_URI=mysql+pymysql://sora_user:${MYSQL_PASSWORD:-sora_password}@mysql:3306/sora_platform?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python worker_gevent.py --workers 100
    volumes:
      - .:/app

  # 定时任务调度器
  scheduler:
    build: .
    container_name: sora_scheduler
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_URI=mysql+pymysql://sora_user:${MYSQL_PASSWORD:-sora_password}@mysql:3306/sora_platform?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python scheduler.py
    volumes:
      - .:/app

volumes:
  mysql_data:
  redis_data:
