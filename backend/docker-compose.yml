version: '3.8'

services:
  # ==========================================
  # MySQL 数据库
  # 安全策略：不暴露端口到宿主机，仅允许容器间通信
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: sora_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 🔒 安全修改：仅允许服务器本机(127.0.0.1)连接
    ports:
      - "127.0.0.1:3306:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    # 优化字符集配置
    command: 
      - --character-set-server=utf8mb4 
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 缓存/队列
  # 安全策略：绑定到 127.0.0.1，设置强密码，禁用危险命令
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: sora_redis
    restart: always
    # 🔒 安全修改：仅允许服务器本机(127.0.0.1)连接，禁止公网IP访问
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    # 🔒 安全修改：设置密码 + 禁用危险命令 + 开启持久化
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD}
      --rename-command FLUSHALL "" 
      --rename-command FLUSHDB "" 
      --rename-command CONFIG ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Flask API 服务
  # ==========================================
  api:
    build: .
    container_name: sora_api
    restart: always
    ports:
      - "5000:5000"
    # 加载 .env 文件中的变量
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn --reload -w 2 -b 0.0.0.0:5000 run:app
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Gevent 异步任务 Worker
  # ==========================================
  worker:
    build: .
    container_name: sora_worker
    extra_hosts:
      - "host.docker.internal:10.1.64.2"
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python worker_gevent.py --workers 100
    volumes:
      - .:/app

  # ==========================================
  # 定时任务调度器
  # ==========================================
  scheduler:
    build: .
    container_name: sora_scheduler
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python scheduler.py
    volumes:
      - .:/app

  # ==========================================
  # phpMyAdmin 管理工具
  # 安全策略：只允许通过 localhost 访问，防止后台暴力破解
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sora_phpmyadmin
    restart: always
    # 🔒 安全修改：绑定 127.0.0.1，必须配合 SSH 隧道使用
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 50M
      MEMORY_LIMIT: 256M
      MAX_EXECUTION_TIME: 300
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data: